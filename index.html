<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006b68" />
    <title>Focus English Lab</title>
    <script>
      window.coi = {
        shouldRegister: () => {
          const local = ['localhost', '127.0.0.1', '::1'].includes(location.hostname)
          return !local || new URLSearchParams(location.search).get('coi') === '1'
        },
        // Safari exposes COEP credentialless but does not consistently enter a
        // cross-origin-isolated context with it. require-corp is reliable and
        // Hugging Face model requests already use CORS.
        coepCredentialless: () => false,
        quiet: true,
      }
    </script>
    <script src="%BASE_URL%coi-serviceworker.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
